name: Verify Avtalslank
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://ykddnagtuacflilbchwx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ui-network-double-no-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 > /tmp/avtalslank-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: browser-verification
          path: |
            .verification/
            test-results/
  worker-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build packaged document and signing worker
        run: docker build -f apps/worker/Dockerfile -t avtalslank-worker-check .
      - name: Verify PDF tool and fail-closed worker readiness
        run: |
          docker run --rm --entrypoint qpdf avtalslank-worker-check --version
          docker run --detach --name al-worker-check --publish 127.0.0.1:8097:8080 avtalslank-worker-check
          trap 'docker logs al-worker-check; docker rm --force al-worker-check' EXIT
          for i in $(seq 1 30); do
            worker_status=$(curl --silent --output /tmp/al-worker-health.json --write-out '%{http_code}' http://127.0.0.1:8097/health || true)
            if [ "$worker_status" = '503' ]; then break; fi
            sleep 1
          done
          test "$worker_status" = '503'
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/al-worker-health.json","utf8")); if(h.configured!==false||h.healthy!==false||h.signingConfigured!==false)process.exit(1); console.log("Packaged worker starts and fails readiness without dedicated credentials.");'
